name: Build and release

on:
  push:
    branches: [native-wpf]
    tags: ['v*']
  pull_request:
    branches: [native-wpf]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and release source
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = & ./scripts/Get-ReleaseVersion.ps1 -Tag $env:GITHUB_REF_NAME
            git merge-base --is-ancestor HEAD origin/native-wpf
            if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on native-wpf.' }
          } else {
            $version = & ./scripts/Get-ReleaseVersion.ps1
          }
          if (-not (Test-Path -LiteralPath "release-notes/v$version.md" -PathType Leaf)) {
            throw "Missing release-notes/v$version.md."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run regression tests
        run: |
          dotnet run --project ./tests/CodexQuotaMonitor.Tests/CodexQuotaMonitor.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }

      - name: Build and verify EXE and MSI
        run: ./Build-Release.ps1

      - name: Save versioned build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaMonitor-${{ steps.version.outputs.version }}-win-x64
          path: publish/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: CodexQuotaMonitor-${{ needs.build.outputs.version }}-win-x64
          path: release-assets

      - name: Verify downloaded release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/Test-ReleasePackage.ps1 -Path ./release-assets -Version $env:RELEASE_VERSION

      - name: Create or update draft release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = context.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            if (context.ref !== `refs/tags/${tag}`) throw new Error('Release tag/version mismatch.');
            const releases = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) throw new Error('Release is already public; publish a new version instead.');
            if (!release) {
              const notes = fs.readFileSync(path.join('release-notes', `${tag}.md`), 'utf8');
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, name: tag, body: notes, draft: true, prerelease: false
              })).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100
            });
            for (const name of ['CodexQuotaMonitor.Wpf.exe', `CodexQuotaMonitor-Setup-${version}.msi`, 'SHA256SUMS']) {
              const old = assets.find(a => a.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({...repo, asset_id: old.id});
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name,
                data: fs.readFileSync(path.join('release-assets', name))
              });
            }
            await core.summary.addHeading(`${tag} draft ready`)
              .addLink('Review assets and publish the release', release.html_url).write();
